[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Tell Railway how to healthcheck the service if needed, but defaults are fine
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
# Railway will automatically set the PORT variable, but it's good practice to document expected ones
# OPENAI_API_KEY must be set in the Railway Dashboard Variables securely
