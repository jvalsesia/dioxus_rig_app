[package]
name = "dioxus_rig_app"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.7", features = ["router", "fullstack"] }
rig-core = { version = "0.36.0", optional = true }
tokio = { version = "1.52.1", features = ["full"], optional = true }

[features]
default = ["web", "server"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:rig-core", "dep:tokio"]
